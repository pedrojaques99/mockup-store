name: CI

# Gate de qualidade — todo push/PR passa por tsc + lint + ui:audit + test + build.
# Falhou aqui, não entra na main.

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela runs antigas do mesmo branch quando chega push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `@visant/psd-engine` é um LINK LOCAL no lockfile
      # (`../../Cursor/visantlabs-os/packages/psd-engine`): existe na máquina do autor e não
      # no runner. O sintoma nunca foi falha de install — o `npm ci` passava e deixava um
      # symlink pendurado — era o `tsc` explodindo em 26 erros, 20 deles cascata de
      # `implicitly any` porque o módulo tipado tinha sumido. CI vermelho em 5 runs
      # seguidas, o que é o mesmo que não ter CI.
      #
      # O repo do pacote é público e ele não tem dependência de runtime: basta clonar no
      # caminho que o lockfile já espera, e o próprio `npm ci` compila o `dist` (que é
      # gitignored) pelo script de build do pacote. Nada aqui muda como alguém instala na
      # própria máquina.
      - name: psd-engine (o link local que o lockfile espera)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/pedrojaques99/visantlabs-os.git ../../Cursor/visantlabs-os
          # O `npm ci` daqui a pouco vai rodar o `build` do pacote linkado, e esse build
          # importa `canvas` (que traz os proprios tipos) e precisa do `typescript`. Os dois
          # entram no clone, e so eles: instalar o monorepo inteiro custaria minutos por um
          # pacote que nao tem dependencia de runtime. `--ignore-scripts` porque o `canvas`
          # e nativo e aqui so os tipos importam.
          npm install --prefix ../../Cursor/visantlabs-os --ignore-scripts --no-audit --no-fund --no-save --legacy-peer-deps canvas typescript

      # .npmrc já tem legacy-peer-deps=true (conflito ag-psd 30 vs peer ^28, aceito de propósito).
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Placar da UI com teto. Pega o que tsc/lint não veem: modal escrito à mão,
      # `<select>` nativo, duração fora do token, botão sem nome acessível.
      # Provado nos dois sentidos (violação injetada ⇒ exit 1).
      - name: UI audit
        run: npm run ui:audit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # O job que impede o repo de voltar a ser "só roda na máquina do autor".
  # Clona limpo, NÃO cria .env.local, não tem Mongo, não tem chave, não tem Z:/ —
  # sobe o app e bate HTTP nele. Se o grid não listar a cena de demonstração, falha.
  # É o que transforma o README de promessa em fato verificado a cada push.
  clone-and-run:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mesmo motivo do job `verify`: o lockfile aponta o psd-engine para um caminho da
      # máquina do autor. Aqui o efeito era outro e pior de diagnosticar — o `npm run build`
      # do Next quebrando nos três sistemas operacionais.
      - name: psd-engine (o link local que o lockfile espera)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/pedrojaques99/visantlabs-os.git ../../Cursor/visantlabs-os
          # O `npm ci` daqui a pouco vai rodar o `build` do pacote linkado, e esse build
          # importa `canvas` (que traz os proprios tipos) e precisa do `typescript`. Os dois
          # entram no clone, e so eles: instalar o monorepo inteiro custaria minutos por um
          # pacote que nao tem dependencia de runtime. `--ignore-scripts` porque o `canvas`
          # e nativo e aqui so os tipos importam.
          npm install --prefix ../../Cursor/visantlabs-os --ignore-scripts --no-audit --no-fund --no-save --legacy-peer-deps canvas typescript

      - name: Install
        run: npm ci

      # Sem nenhuma variável de ambiente — é exatamente o caso do dev novo.
      - name: Setup
        run: npm run setup

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Sobe, espera a porta responder e passa o smoke. Tudo num passo só, em
      # bash (disponível também no runner Windows) — um `&` solto morreria com
      # o fim do passo, e `&` nem é sintaxe válida no PowerShell do runner.
      - name: Start + smoke
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npx next start -p 3123 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3123 >/dev/null; then break; fi
            if [ "$i" = "60" ]; then echo "app não subiu em 60s"; exit 1; fi
            sleep 1
          done
          npm run smoke -- --url http://localhost:3123
          # Portão visual: dirige um Chrome de verdade e checa o que só se vê com
          # o olho (diálogo abre, nada cortado pelas bordas, validação reprova
          # caminho inexistente, lista virtualizada). O `npm ci` já baixa o
          # Chromium do puppeteer. A fixture é o que torna a checagem de
          # virtualização real em vez de pulada.
          npm run fixture:virt
          npm run visual:ingest -- --url http://localhost:3123
          # O app é distribuível? Este runner É a máquina de quem baixou: sem
          # .env.local, sem Mongo, sem acervo. O portão confere que o catálogo
          # sobe local, que dá para configurar acervo e chave PELA API (sem
          # editar arquivo, sem reiniciar) e que a chave nunca volta em claro.
          # Provado nos dois sentidos: vazar a chave derruba o passo.
          npm run check:offline -- --url http://localhost:3123
